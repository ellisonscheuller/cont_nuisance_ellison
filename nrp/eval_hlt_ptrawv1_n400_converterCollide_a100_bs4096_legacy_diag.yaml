apiVersion: batch/v1
kind: Job
metadata:
  name: eval-hlt-nurd-ptrawv1-n400-converter-collide-a100-bs4096-legacy-diag
  # Re-run of train_hlt_ptrawv1_converterCollide_a100_n400.yaml's Step 3 legacy eval only --
  # AE/NURD/baseline checkpoints already exist on collide2vsubset from that job, so this just
  # pulls latest eval_abcd_nurd.py (axis-2 tail/eigenvalue diagnostic added) and re-runs the
  # eval against them, to explain the closure_scan_2d.png cutoff before picking a fix.
  namespace: aida-scout
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
      containers:
        - name: eval
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="
              python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              which git > /dev/null || (apt-get update -qq && apt-get install -y -qq git)
              pip install --quiet scipy scikit-learn matplotlib wandb

              CKPT_DIR=/collide2vsubset/escheuller/collide2v_ptrawv1_n400/cont_nuisance_ellison
              if [ ! -d "$CKPT_DIR" ]; then
                echo "ERROR: $CKPT_DIR does not exist -- run train_hlt_ptrawv1_converterCollide_a100_n400.yaml first." >&2
                exit 1
              fi
              cd "$CKPT_DIR"
              git checkout main
              git pull --ff-only
              pip install --quiet -r nrp/requirements_nrp.txt

              TEST_PT=/collide2vsubset/escheuller/collide2v_ptrawv1_n400_tensors/collide2v_ptrawv1_n400_test.pt
              SIGNAL_PT=/collide2vsubset/escheuller/collide2v_signal_ptrawv1_n400/collide2v_signal_ptrawv1_n400.pt
              CLASS_NAMES=DY,QCD,WJetsToLNu,WJetsToQQ,ZJetsToQQ,ZJetsTobb,ZJetsTocc,ZJetsTovv,TTHadronic,TTLeptonic,TTSemiLeptonic

              AE_EXP=ae_ptrawv1_n400_converterCollide_a100_bs4096
              NURD_EXP=hlt_nurd_ptrawv1_n400_converterCollide_a100_bs4096
              BASELINE_EXP=hlt_nodecorr_ptrawv1_n400_converterCollide_a100_bs4096
              AE_CKPT=checkpoints/hlt/hlt/$AE_EXP/checkpoint_ae.pth
              NURD_CKPT=checkpoints/hlt/hlt/$NURD_EXP/checkpoint_main.pth.tar
              BASELINE_CKPT=checkpoints/hlt/hlt/$BASELINE_EXP/checkpoint_main.pth.tar
              for f in "$TEST_PT" "$SIGNAL_PT" "$AE_CKPT" "$NURD_CKPT" "$BASELINE_CKPT"; do
                if [ ! -s "$f" ]; then
                  echo "ERROR: required input is missing: $f" >&2
                  exit 1
                fi
              done

              echo "=== Legacy ABCD closure eval (with axis-2 diagnostic): $(date) ==="
              mkdir -p outputs/ptrawv1_n400_converterCollide_eval/legacy_diag
              python eval_abcd_nurd.py \
                --ckpt         "$NURD_CKPT" \
                --ae_ckpt      "$AE_CKPT" \
                --test_pt      "$TEST_PT" \
                --signal_pt    "$SIGNAL_PT" \
                --signal_class_names ttH,HHbbgg,tttt \
                --baseline_ckpt "$BASELINE_CKPT" \
                --class_names  "$CLASS_NAMES" \
                --outdir       outputs/ptrawv1_n400_converterCollide_eval/legacy_diag \
                --n_pca        6 \
                --qcd_label    1 \
                --wandb_run_name ptrawv1_n400_converterCollide_a100_bs4096_legacy_diag
              echo "=== Legacy eval done: $(date) ==="
              echo "Output: $CKPT_DIR/outputs/ptrawv1_n400_converterCollide_eval/legacy_diag"
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: WANDB_API_KEY
          resources:
            requests:
              memory: "48Gi"
              cpu: "4"
              nvidia.com/a100: "1"
            limits:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: collide2vsubset
              mountPath: /collide2vsubset
      volumes:
        - name: collide2vsubset
          persistentVolumeClaim:
            claimName: collide2vsubset
