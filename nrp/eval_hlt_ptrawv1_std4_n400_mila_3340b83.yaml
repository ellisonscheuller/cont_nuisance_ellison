apiVersion: batch/v1
kind: Job
metadata:
  name: eval-hlt-nurd-ptrawv1-std4-n400-mila-3340b83
  # Isolates "which code version" as the only variable behind the std4 (4-class)
  # closure result: pins mbileska/nurd_hlt at 3340b834e35e70a75ac04d04175ba1ebe1325d24
  # (2026-08-24, "Add evaluation-only campaign retry") -- confirmed a genuine shared
  # ancestor with her repo (git merge-base --is-ancestor), predating both our 11-class/
  # KernelPCA switch (d19f762) and her own later divergence (weighted conditional
  # nuisance resampling etc.) -- i.e. actually her code, not our fork's later changes.
  # No --pca_kernel exists at this commit: axis 2 MD is linear-PCA whitened only.
  #
  # Reuses the already-converted std4 n400 COLLIDE tensors (same data as the std4 run
  # that showed the bad closure) -- trains its own fresh AE+NURD checkpoints under this
  # exact pinned commit (checkpoints from a different code version aren't reusable here;
  # eval_abcd_nurd.py hash-checks the AE ckpt against what NURD was trained against).
  #
  # This commit's train_hlt.py has no --info_warmup_epochs/--info_ramp_epochs/
  # --lr_schedule_epochs (added later) -- uses plain --epochs 40, immediate full
  # lambda_info penalty, matching the un-ramped behavior our own std4 job used before
  # it was changed to mirror mila's later ramped campaign.
  #
  # This commit's hardcoded class_names = {0: DY, 1: QCD, 2: TT, 3: WJets}, but our
  # std4 data has QCD=0/TT=1/WJets=2/DY=3 (data_collide2v_ptrawv1_std4_n400.yaml's
  # samples: order) -- --qcd_label 0 makes the actual ABCD math correct regardless;
  # only plot legend text will show mismatched names.
  namespace: aida-scout
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
      containers:
        - name: train-and-eval
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="
              python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              which git > /dev/null || (apt-get update -qq && apt-get install -y -qq git)
              pip install --quiet scipy scikit-learn matplotlib wandb

              TRAIN_PT=/collide2vsubset/escheuller/collide2v_ptrawv1_std4_n400/collide2v_ptrawv1_std4_n400_train.pt
              TEST_PT=/collide2vsubset/escheuller/collide2v_ptrawv1_std4_n400/collide2v_ptrawv1_std4_n400_test.pt
              SIGNAL_PT=/collide2vsubset/escheuller/collide2v_signal_ptrawv1_n400/collide2v_signal_ptrawv1_n400.pt
              for f in "$TRAIN_PT" "$TEST_PT" "$SIGNAL_PT"; do
                if [ ! -s "$f" ]; then
                  echo "ERROR: required input is missing: $f" >&2
                  exit 1
                fi
              done

              mkdir -p /collide2vsubset/escheuller/collide2v_ptrawv1_std4_n400/mila_3340b83
              cd /collide2vsubset/escheuller/collide2v_ptrawv1_std4_n400/mila_3340b83
              if [ ! -d nurd_hlt ]; then
                git clone --quiet https://github.com/mbileska/nurd_hlt.git
              fi
              cd nurd_hlt
              git fetch --quiet origin 3340b834e35e70a75ac04d04175ba1ebe1325d24
              git checkout --quiet 3340b834e35e70a75ac04d04175ba1ebe1325d24
              pip install --quiet -r requirements.txt || true
              CODE_COMMIT="$(git rev-parse HEAD)"
              echo "Pinned code commit: $CODE_COMMIT"

              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

              AE_EXP=ae_ptrawv1_std4_n400_mila_3340b83
              NURD_EXP=hlt_nurd_ptrawv1_std4_n400_mila_3340b83
              AE_CKPT=checkpoints/hlt/hlt/$AE_EXP/checkpoint_ae.pth
              NURD_CKPT=checkpoints/hlt/hlt/$NURD_EXP/checkpoint_main.pth.tar

              echo "=== Step 1: AE pretraining: $(date) ==="
              python train_ae.py \
                --data         $TRAIN_PT \
                --qcd_label    0 \
                --epochs       100 \
                --batch_size   4096 \
                --lr           1e-3 \
                --latent_dim   16 \
                --enc_nodes    512 256 \
                --dec_nodes    256 512 \
                --exp_name     $AE_EXP \
                --project_name hlt \
                --manualSeed   42
              echo "=== AE pretraining done: $(date) ==="

              echo "=== Step 2: NURD training (mila's 3340b83 code, no warmup/ramp support): $(date) ==="
              python train_hlt.py \
                --data         $TRAIN_PT \
                --ae_ckpt      $AE_CKPT \
                --qcd_label    0 \
                --balance_strata 20 \
                --epochs       40 \
                --batch_size   4096 \
                --num_workers  0 \
                --lr           1e-4 \
                --critic_lr    1e-3 \
                --critic_steps 3 \
                --lambda_info  1.0 \
                --contrast_weight 0.3 \
                --contrast_temp   0.05 \
                --weight_decay 5e-3 \
                --embed_size   128 \
                --latent_dim   6 \
                --proj_dim     6 \
                --num_heads    8 \
                --num_layers   4 \
                --dim_ff       512 \
                --linear_dim   16 \
                --patience     15 \
                --exp_name     $NURD_EXP \
                --project_name hlt \
                --manualSeed   42 \
                --code_commit  "$CODE_COMMIT"
              echo "=== NURD training done: $(date) ==="

              echo "=== Step 3: legacy ABCD closure eval (mila's linear-PCA MD): $(date) ==="
              mkdir -p outputs/ptrawv1_std4_n400_mila_3340b83_eval/legacy
              python eval_abcd_nurd.py \
                --ckpt         "$NURD_CKPT" \
                --ae_ckpt      "$AE_CKPT" \
                --test_pt      "$TEST_PT" \
                --signal_pt    "$SIGNAL_PT" \
                --outdir       outputs/ptrawv1_std4_n400_mila_3340b83_eval/legacy \
                --n_pca        6 \
                --qcd_label    0 \
                --wandb_run_name ptrawv1_std4_n400_mila_3340b83_legacy
              echo "=== Legacy eval done: $(date) ==="
              echo "Output: $(pwd)/outputs/ptrawv1_std4_n400_mila_3340b83_eval/legacy"

              echo "=== Job finished: $(date) ==="
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: WANDB_API_KEY
          resources:
            requests:
              memory: "192Gi"
              cpu: "8"
              nvidia.com/a100: "1"
            limits:
              memory: "256Gi"
              cpu: "16"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: collide2vsubset
              mountPath: /collide2vsubset
      volumes:
        - name: collide2vsubset
          persistentVolumeClaim:
            claimName: collide2vsubset
